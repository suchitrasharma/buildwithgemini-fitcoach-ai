<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCoach AI - Personal Workout & Fitness Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #059669;
    --accent-hover: #047857;
    --accent-light: #ecfdf5;
    --accent-border: #a7f3d0;
    --accent-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
    --bg-body: #f8fafc;
    --card-bg: #ffffff;
    --border-color: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.06);
    --shadow-user: 0 4px 14px rgba(5, 150, 105, 0.22);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Top Bar Header --- */
  header {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 0.85rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-icon {
    width: 38px;
    height: 38px;
    background: var(--accent-gradient);
    color: #fff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
  }
  .header-title {
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--text-main);
    line-height: 1.2;
  }
  .header-subtitle {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 400;
  }
  .header-status {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--accent-light);
    color: var(--accent);
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    border: 1px solid var(--accent-border);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
  }

  /* --- Dialogue Area --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    animation: fadeInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .bubble {
    display: inline-block;
    padding: 0.85rem 1.15rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    text-align: left;
    max-width: 85%;
    white-space: pre-wrap;
    font-size: 0.95rem;
    line-height: 1.55;
    box-shadow: var(--shadow-sm);
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-user);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
    color: var(--text-main);
  }

  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* --- Clickable Prompt Chips --- */
  .chip-row {
    display: flex;
    gap: 0.6rem;
    padding: 0.5rem 1rem 0.25rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    background: #ffffff;
    color: var(--accent);
    border: 1px solid var(--accent-border);
    padding: 0.45rem 0.9rem;
    border-radius: 20px;
    font-size: 0.84rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .chip:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.15);
  }

  /* --- Input Form Bar --- */
  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border-color);
    background: #ffffff;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    align-items: center;
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: #f8fafc;
  }
  input:focus {
    background: #ffffff;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
  }
  button.send-btn {
    padding: 0.8rem 1.3rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25);
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  button.send-btn:hover {
    opacity: 0.92;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
  }

  /* --- A2UI Component Styles --- */
  .a2card {
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.2rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border-color); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* --- Category Quick-Filter Bar --- */
  .category-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem 1.25rem;
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    z-index: 5;
  }
  .category-bar::-webkit-scrollbar { display: none; }
  .cat-pill {
    background: #f1f5f9;
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 0.4rem 0.85rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    flex-shrink: 0;
  }
  .cat-pill:hover {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent-border);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(5, 150, 105, 0.12);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">🏋️</div>
    <div>
      <div class="header-title">FitCoach AI</div>
      <div class="header-subtitle">AI Workout & Fitness Assistant</div>
    </div>
  </div>
  <div class="header-status">
    <div class="status-dot"></div>
    <span>Agent Active</span>
  </div>
</header>

<div class="category-bar">
  <button type="button" class="cat-pill" onclick="sendPrompt('List exercises for chest')">🏋️ Chest</button>
  <button type="button" class="cat-pill" onclick="sendPrompt('List exercises for legs')">🦵 Legs</button>
  <button type="button" class="cat-pill" onclick="sendPrompt('List exercises for arms')">💪 Arms</button>
  <button type="button" class="cat-pill" onclick="sendPrompt('Calculate my 1RM for 200 lbs at 5 reps')">📊 1RM Calculator</button>
  <button type="button" class="cat-pill" onclick="sendPrompt('Generate a milestone badge for 25 workouts')">🏆 Badges</button>
  <button type="button" class="cat-pill" onclick="sendPrompt('List exercises for core')">🧘 Core</button>
</div>

<div id="log"></div>

<div class="chip-row">
  <button type="button" class="chip" onclick="sendPrompt('List exercises for chest')">🏋️ List exercises for chest</button>
  <button type="button" class="chip" onclick="sendPrompt('Calculate my 1RM for 185 lbs at 5 reps')">💪 Calculate 1RM for 185 lbs at 5 reps</button>
  <button type="button" class="chip" onclick="sendPrompt('Generate a milestone badge for 50 workouts completed')">🏆 Generate badge for 50 workouts</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask FitCoach AI about exercises, 1RM, routines, or workouts…" autocomplete="off" autofocus>
  <button class="send-btn">Send ➔</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
